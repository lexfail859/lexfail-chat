<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nemotron Chat</title>
  <style>
    /* (keep most current styles) */
    :root { --primary-color:#0b5cff; --light-bg:#f9fafb; --border:#e5e7eb; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width:900px; margin:0 auto; padding:1rem; color:#111827; }
    header { text-align:center; margin-bottom:1rem; }
    h1 { color: var(--primary-color); }
    .controls { display:flex; gap:.5rem; align-items:center; justify-content:center; margin-bottom: .5rem; }
    .chat-container { border:1px solid var(--border); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; height: calc(100vh - 200px); min-height:420px;}
    .chat-messages { flex:1; overflow:auto; padding:1rem; background:var(--light-bg); }
    .message { margin-bottom:1rem; padding:.75rem; border-radius:8px; max-width:80%; }
    .user-message { background:#fff2e6; margin-left:auto; align-self:flex-end; }
    .assistant-message { background:#f3f4f6; align-self:flex-start; }
    .message-input { display:flex; padding:.75rem; border-top:1px solid var(--border); background:white; gap:.5rem; }
    #user-input { flex:1; min-height:48px; padding:.5rem; border:1px solid var(--border); border-radius:6px; resize:none; }
    #send-button { background:var(--primary-color); color:white; border:none; padding:0 .9rem; border-radius:6px; cursor:pointer; }
    #system-prompt { width:100%; min-height:60px; font-size:.9rem; padding:.5rem; border-radius:6px; border:1px solid var(--border); }
    .small { font-size:.85rem; color:#6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>Nemotron Chat</h1>
    <p class="small">Powered by @cf/nvidia/nemotron-3-120b-a12b</p>
  </header>

  <div class="controls">
    <label for="model-select">Model:</label>
    <select id="model-select">
      <option value="@cf/nvidia/nemotron-3-120b-a12b" selected>Nemotron 3-120B</option>
      <option value="@cf/meta/llama-3.1-8b-instruct-fp8">Llama 3.1 8B (fallback)</option>
    </select>
    <button id="toggle-prompt">Edit system prompt</button>
  </div>

  <div id="prompt-area" style="display:none; margin-bottom:.5rem;">
    <textarea id="system-prompt">You are Nemotron, a helpful and concise assistant. Provide accurate, evidence-based answers; ask one clarifying question if needed.</textarea>
    <div class="small">System prompt sent to the model (editable).</div>
  </div>

  <div class="chat-container">
    <div id="chat-messages" class="chat-messages">
      <div class="message assistant-message"><p>Hello! I’m Nemotron — how can I help?</p></div>
    </div>

    <div id="typing-indicator" class="small" style="padding: .5rem; display:none;">Nemotron is thinking...</div>

    <div class="message-input">
      <textarea id="user-input" placeholder="Ask me anything..." rows="1" autofocus></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>

  <footer style="text-align:center; margin-top:.75rem;" class="small">
    Nemotron Chat Template • <span id="current-model">@cf/nvidia/nemotron-3-120b-a12b</span>
  </footer>

  <script src="chat.js"></script>
</body>
</html>
